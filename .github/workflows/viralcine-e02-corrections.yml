name: ViralCine E02 correction verification
on:
  pull_request:
    paths:
      - 'components/V7Scene02CorrectionPanel.tsx'
      - 'components/V7RunwayScene02Panel.tsx'
      - 'lib/v7/production/e02-correction-store.ts'
      - 'lib/v7/production/runway-e02-engine.ts'
      - 'app/api/v7/films/**'
      - 'tests/e02-correction-workflow.test.ts'
      - '.github/workflows/viralcine-e02-corrections.yml'
  push:
    branches:
      - 'feat/v8-e02-correction-workflow-20261030'
jobs:
  verify:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install FFmpeg for Windows media tests
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg installation failed" }
          $ff = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if (-not $ff) {
            $ff = Get-ChildItem 'C:\\ProgramData\\chocolatey\\lib' -Recurse -File -Filter ffmpeg.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $ff) { throw 'ffmpeg.exe not found after install' }
            $dir = Split-Path -Parent $ff.FullName
            $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = "$dir;$env:PATH"
          }
          & ffmpeg -version | Select-Object -First 1
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
