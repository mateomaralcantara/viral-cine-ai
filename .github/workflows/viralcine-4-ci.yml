name: ViralCine 4.0 CI

on:
  push:
    branches:
      - feat/viralcine-4-real-cinema
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: FFmpeg availability
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Real Cinema offline smoke
        env:
          PRODUCTION_MODE: demo
          REAL_CINEMA_PIPELINE: 'true'
          ALLOW_EXTERNAL_API_CALLS: 'false'
          ALLOW_PAID_GENERATION: 'false'
          PILOT_MODE: 'false'
          FAKE_PROVIDER_SCENARIO: success
        run: npm run smoke

      - name: Production build
        run: npm run build

      - name: Production dependency audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
